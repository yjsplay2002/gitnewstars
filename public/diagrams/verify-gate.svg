<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-labelledby="t5">
  <title id="t5">A finding passes through three independent verifiers on the edge; only findings that survive a majority reach the final answer</title>
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#141413"/>
    </marker>
  </defs>
  <style>
    .n { fill:#fff; stroke:#141413; stroke-width:1.4 }
    .n-ok { fill:#eef1e9; stroke:#4d6b36; stroke-width:1.4 }
    .n-v { fill:#fff; stroke:#c15f3c; stroke-width:1.3 }
    .e { stroke:#141413; stroke-width:1.4; fill:none; marker-end:url(#a5) }
    .lb { font:600 13px system-ui,-apple-system,'Segoe UI',sans-serif; fill:#141413 }
    .sm { font:500 12px system-ui,-apple-system,'Segoe UI',sans-serif; fill:#5f5d57 }
    .cap { font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#5f5d57; letter-spacing:.12em }
    .kill { font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#c15f3c; letter-spacing:.06em }
  </style>

  <text class="cap" x="8" y="20">FINDING</text>
  <text class="cap" x="278" y="20">VERIFIERS ON THE EDGE</text>
  <text class="cap" x="600" y="20">ANSWER</text>

  <rect class="n" x="8" y="80" width="130" height="44" rx="3"/>
  <text class="lb" x="73" y="107" text-anchor="middle">finder</text>

  <path class="e" d="M138 102 C210 102 220 46 278 46"/>
  <path class="e" d="M138 102 C210 102 220 102 278 102"/>
  <path class="e" d="M138 102 C210 102 220 158 278 158"/>

  <rect class="n-v" x="278" y="28" width="186" height="36" rx="3"/>
  <text class="sm" x="371" y="51" text-anchor="middle">correctness</text>
  <rect class="n-v" x="278" y="84" width="186" height="36" rx="3"/>
  <text class="sm" x="371" y="107" text-anchor="middle">security</text>
  <rect class="n-v" x="278" y="140" width="186" height="36" rx="3"/>
  <text class="sm" x="371" y="163" text-anchor="middle">reproducibility</text>

  <path class="e" d="M464 46 C520 46 530 102 586 102"/>
  <path class="e" d="M464 102 H586"/>
  <path class="e" d="M464 158 C520 158 530 102 586 102"/>

  <rect class="n-ok" x="586" y="80" width="126" height="44" rx="3"/>
  <text class="lb" x="649" y="107" text-anchor="middle">survivors</text>
  <text class="kill" x="649" y="146" text-anchor="middle">refuted = dropped</text>
</svg>
